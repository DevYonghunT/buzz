name: SchoolX Team Build

# Unsigned macOS and Windows installers for internal team feedback.
#
# Why this exists alongside `release.yml`: that workflow is gated on
# `github.repository == 'block/buzz'`, signs macOS through Block's Apple
# account (`block/apple-codesign-action`, OIDC-bound to that org), and publishes
# a GitHub Release with auto-updater artifacts. None of that is available to —
# or wanted by — a SchoolX fork handing builds to a handful of teammates.
#
# So this borrows the shape of `windows-canary.yml` (build, upload as a
# short-lived Actions artifact, no tag and no Release) and adds two macOS jobs
# that stop after `--no-sign`, which is exactly where `release.yml` hands off to
# the signing action.
#
# Two macOS jobs because `macos-latest` is Apple Silicon: a plain host build is
# arm64-only and will not launch at all on an Intel Mac — and the failure looks
# like the unsigned-app warning, so a tester cannot tell the two apart. The
# Intel job cross-compiles with `--target x86_64-apple-darwin`, mirroring the
# split `release.yml` already makes. Testers pick by architecture; the "which
# file do I want" instructions live in TEAM_BUILD.md §2.
#
# **What testers get is unsigned.** macOS shows "unidentified developer" and
# Windows shows a SmartScreen warning; both need a manual override to open. That
# is the accepted trade for a build that costs nothing to produce. Signing needs
# an Apple Developer account (macOS) and a code-signing certificate (Windows),
# which are purchases, not code changes.
#
# Linux is omitted: the team is on macOS and Windows, and every extra platform
# is another job to keep green for no reader.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Derive version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Derive team-build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version '$BASE_VERSION' is not semver"
            exit 1
          fi
          # Suffix rather than bump: these builds are never promoted, and a
          # plain version would be indistinguishable from a real release in a
          # tester's Applications folder.
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-team.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building team version $VERSION from $GITHUB_SHA"

  macos-arm64:
    name: Build macOS · Apple Silicon (unsigned)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace
      - name: Generate non-updating bundle config
        run: |
          # No updater artifacts: there is no endpoint to publish them to, and a
          # build that advertises an update it cannot fetch is worse than one
          # that never checks.
          cat > desktop/src-tauri/tauri.team.conf.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          JSON
      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          # No argument. bundle-sidecars.sh treats a present $1 as "cargo was
          # invoked with --target" and looks under target/<triple>/release; this
          # build has no --target, so the binaries are in target/release. Passing
          # the host triple here sent it to an empty directory. Same pairing as
          # release.yml's arm64 macOS job — the Windows job below does pass one
          # because it does build with --target.
          ./scripts/bundle-sidecars.sh
      - name: Build macOS app (unsigned)
        # `--no-sign` is where release.yml stops before handing the bundle to
        # Block's signing action. The embedded Code Git XPC is still packaged,
        # but its empty TeamIdentifier makes the runtime authority gate return
        # unsupported before mutation in this unsigned tester build.
        run: cd desktop && pnpm tauri build --verbose --no-sign --config src-tauri/tauri.team.conf.json
        env:
          SCHOOLX_CODE_GIT_CARGO_LAYOUT: native
      - name: Locate DMG
        id: artifact
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          if [[ -z "$DMG" ]]; then
            echo "::error::No DMG found in $BUNDLE_DIR/dmg"
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
      - name: Upload Apple Silicon installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: schoolx-macos-apple-silicon-${{ needs.version.outputs.version }}
          if-no-files-found: error
          path: ${{ steps.artifact.outputs.dmg }}

  macos-intel:
    name: Build macOS · Intel (unsigned)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: x86_64-apple-darwin
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-apple-darwin
      # Belt and braces, exactly as release.yml's Intel job does it: the runner
      # host is arm64, so the x86_64 std must be present before any build.
      - name: Add Rust target
        run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace
      - name: Generate non-updating bundle config
        run: |
          cat > desktop/src-tauri/tauri.team.conf.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          JSON
      - name: Build sidecars
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"
      - name: Build macOS app (unsigned)
        run: cd desktop && pnpm tauri build --verbose --no-sign --target "$TARGET" --config src-tauri/tauri.team.conf.json
        # Keep the helper in the unsigned artifact for bundle parity. Runtime
        # peer authentication rejects the missing TeamIdentifier before any
        # Code Git mutation is attempted.
        env:
          SCHOOLX_CODE_GIT_CARGO_LAYOUT: target-triple
      - name: Locate DMG
        id: artifact
        run: |
          set -euo pipefail
          # Cross-compiled output is under target/<triple>/, unlike the host
          # build in the Apple Silicon job above.
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          if [[ -z "$DMG" ]]; then
            echo "::error::No DMG found in $BUNDLE_DIR/dmg"
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
      - name: Upload Intel installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: schoolx-macos-intel-${{ needs.version.outputs.version }}
          if-no-files-found: error
          path: ${{ steps.artifact.outputs.dmg }}

  windows:
    name: Build Windows (unsigned)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: x86_64-pc-windows-msvc
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Patch version
        shell: bash
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace
      - name: Generate non-updating bundle config
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.team.conf.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          JSON
      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"
      - name: Build Windows NSIS installer (unsigned)
        shell: bash
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles nsis --config src-tauri/tauri.team.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Locate NSIS installer
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          EXE=$(find "$BUNDLE_DIR/nsis" -name '*.exe' -type f | head -1)
          if [[ -z "$EXE" ]]; then
            echo "::error::No NSIS installer found in $BUNDLE_DIR/nsis"
            exit 1
          fi
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: schoolx-windows-${{ needs.version.outputs.version }}
          if-no-files-found: error
          path: ${{ steps.artifact.outputs.exe }}
